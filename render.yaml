services:
  - type: web
    name: puntland-market
    runtime: node
    plan: free

    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build

    startCommand: npm start

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: puntland-market-db
          property: connectionString

      - key: AUTH_SECRET
        generateValue: true

      - key: NEXT_PUBLIC_APP_URL
        value: https://puntland-market.onrender.com

      - key: SAHAL_ENABLED
        value: "false"

      - key: SAHAL_MERCHANT_ID
        sync: false

      - key: SAHAL_API_BASE_URL
        sync: false

      - key: SAHAL_API_KEY
        sync: false

      - key: SAHAL_WEBHOOK_SECRET
        sync: false

      - key: WHATSAPP_ENABLED
        value: "false"

      - key: WHATSAPP_PROVIDER_URL
        sync: false

      - key: WHATSAPP_API_TOKEN
        sync: false

      - key: SMS_ENABLED
        value: "false"

      - key: SMS_PROVIDER_URL
        sync: false

      - key: SMS_API_TOKEN
        sync: false

databases:
  - name: puntland-market-db
    plan: free
